<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CrypTool 2 Web Edition</title>
    <base href="/"/>
    <link id="webassembly" rel="preload"/>
    <script>
        // the light/dark mode of the last visit (see ct2.setUiMode): applied before anything is drawn
        try {
            const mode = localStorage.getItem('ct2web.uimode');
            if (mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
                document.documentElement.classList.add('ui-dark');
        } catch (e) { /* storage unavailable */ }
    </script>
    <style>
        html, body {
            margin: 0;
            height: 100%
        }

        .splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(#e8eef9, #c3d3f2);
            font-family: "Segoe UI", system-ui, sans-serif;
            color: #2b3f6b
        }

        /* cipher disk (Alberti/Caesar): the outer ring is the plaintext alphabet, the inner ring turns one letter at a
           time, so the window at the top always shows the current Caesar shift; the ring around it is the load progress */
        .splash-disk {
            position: relative;
            width: 196px;
            height: 196px;
            margin-bottom: 14px;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .2))
        }

        .splash-disk::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(#3b5aa0 var(--splash-percent, 0%), rgba(59, 90, 160, .15) 0);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
            transition: background .2s
        }

        .splash.done .splash-disk::before { background: #3b5aa0 }
        .splash.failed .splash-disk::before { display: none }

        .splash-disk svg {
            position: absolute;
            inset: 9px;
            width: calc(100% - 18px);
            height: calc(100% - 18px);
            overflow: visible
        }

        .splash-disk text {
            font: 600 11px ui-monospace, "Cascadia Mono", Consolas, monospace;
            text-anchor: middle;
            dominant-baseline: central
        }

        .sd-outer { fill: #fff; stroke: #9fb2d8 }
        .sd-outer-text { fill: #2b3f6b }
        .sd-inner { fill: #dfe7f7; stroke: #9fb2d8 }
        .sd-inner-text { fill: #3b5aa0 }
        .sd-hub { fill: #fff; stroke: #9fb2d8 }
        .sd-window { fill: none; stroke: #e0a020; stroke-width: 2 }

        .sd-turn {
            transform-origin: 0 0;
            animation: splash-turn 10.4s infinite
        }

        /* the title is "decrypted" while the app loads: the letters not yet loaded show with the shift of the disk */
        .splash-title {
            font: 600 26px ui-monospace, "Cascadia Mono", Consolas, monospace;
            letter-spacing: .5px;
            margin-bottom: 14px;
            white-space: pre
        }

        .splash-title .enc { color: #8a9cc4 }

        .splash-text {
            font-size: 12px;
            color: #5b6f98;
            min-height: 16px
        }

        .splash-text::after {
            content: " " var(--splash-percent-text, "")
        }

        html.ui-dark .splash { background: linear-gradient(#1f2738, #131927); color: #d6e0f5 }
        html.ui-dark .sd-outer { fill: #1c2433; stroke: #46557a }
        html.ui-dark .sd-hub { fill: #dfe7f7; stroke: #46557a }
        html.ui-dark .splash-disk::before { background: conic-gradient(#7d9ee6 var(--splash-percent, 0%), rgba(125, 158, 230, .15) 0) }
        html.ui-dark .splash.done .splash-disk::before { background: #7d9ee6 }
        html.ui-dark .sd-outer-text { fill: #d6e0f5 }
        html.ui-dark .sd-inner { fill: #26314a; stroke: #46557a }
        html.ui-dark .sd-inner-text { fill: #9db8f0 }
        html.ui-dark .splash-title .enc { color: #5d6d92 }
        html.ui-dark .splash-text { color: #93a3c6 }

        @media (prefers-reduced-motion: reduce) {
            .sd-turn { animation: none; transform: rotate(-41.538deg) }
        }
    </style>
    <link href="lib/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="css/app.css" rel="stylesheet"/>
    <link href="css/i18n.css" rel="stylesheet"/>
    <link href="css/wpf.css" rel="stylesheet"/>
    <link href="lib/katex/katex.min.css" rel="stylesheet"/>
    <link href="css/docs.css" rel="stylesheet"/>
    <link href="css/dark.css" rel="stylesheet"/>
    <link href="css/docbg.css" rel="stylesheet"/>
    <link href="favicon.ico" rel="icon" sizes="16x16 32x32 48x48"/>
    <link href="favicon.png" rel="icon" sizes="32x32" type="image/png"/>
    <link href="icon-192.png" rel="icon" sizes="192x192" type="image/png"/>
    <link href="manifest.webmanifest" rel="manifest"/>
    <link href="apple-touch-icon.png" rel="apple-touch-icon"/>
    <meta content="#2b3f6b" name="theme-color"/>
    <script type="importmap"></script>
    <!-- first: records messages and errors from the start, and shows the error report when the app crashes -->
    <script src="crashreport.js"></script>
</head>

<body>
<div id="app">
    <div class="splash">
        <div class="splash-disk"></div>
        <div class="splash-title">CrypTool 2 Web Edition</div>
        <div class="splash-text">Loading…</div>
    </div>
</div>

<script>
    // Loading screen: draws the cipher disk into every ".splash-disk" (also the one of Home.razor, which stays up until the
    // start is decided) and "decrypts" the title while the app loads: the letters not loaded yet are shown Caesar-encrypted
    // with the shift the disk shows right now. All disks run on the page's clock, so the handover to Home.razor is seamless.
    window.ctSplash = (function () {
        const STEP = 400;                       // ms per letter of the disk (10.4 s per turn, see .sd-turn)
        const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const NS = 'http://www.w3.org/2000/svg';
        const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let stopped = false;

        // one step per letter: rest, then turn to the next letter
        const frames = [];
        for (let k = 0; k < 26; k++) {
            frames.push({ offset: k / 26, transform: `rotate(${-k * 360 / 26}deg)`, easing: 'step-end' });
            frames.push({ offset: (k + .72) / 26, transform: `rotate(${-k * 360 / 26}deg)`, easing: 'ease-in-out' });
        }
        frames.push({ offset: 1, transform: 'rotate(-360deg)' });
        const style = document.createElement('style');
        style.textContent = '@keyframes splash-turn {' + frames.map(f =>
            `${(f.offset * 100).toFixed(3)}% { transform: ${f.transform}; animation-timing-function: ${f.easing} }`).join('') + '}';
        document.head.appendChild(style);

        function el(name, attrs, parent) {
            const e = document.createElementNS(NS, name);
            for (const a in attrs) e.setAttribute(a, attrs[a]);
            parent.appendChild(e);
            return e;
        }

        function ring(parent, r, cls) {
            for (let i = 0; i < 26; i++)
                el('text', { x: 0, y: -r, class: cls, transform: `rotate(${i * 360 / 26})` }, parent).textContent = A[i];
        }

        function draw(box) {
            if (box.firstChild) return;
            const svg = el('svg', { viewBox: '-100 -100 200 200', 'aria-hidden': 'true' }, box);
            el('circle', { r: 99, class: 'sd-outer' }, svg);
            ring(svg, 88, 'sd-outer-text');
            const turn = el('g', { class: 'sd-turn' }, svg);
            el('circle', { r: 77, class: 'sd-inner' }, turn);
            ring(turn, 66, 'sd-inner-text');
            el('circle', { r: 54, class: 'sd-hub' }, svg);
            el('image', { href: 'logo.png', x: -38, y: -38, width: 76, height: 76 }, svg);
            el('rect', { x: -10, y: -100, width: 20, height: 46, rx: 6, class: 'sd-window' }, svg);
            // run on the page's clock: a disk drawn later (Home.razor) stands where the first one stood
            for (const a of turn.getAnimations ? turn.getAnimations() : []) a.startTime = 0;
        }

        function shift() {
            return still ? 3 : Math.floor((document.timeline.currentTime || performance.now()) / STEP) % 26;
        }

        function caesar(c, k) {
            const u = c.toUpperCase(), i = A.indexOf(u);
            if (i < 0) return c;
            const e = A[(i + k) % 26];
            return c === u ? e : e.toLowerCase();
        }

        // the title of index.html only; the one of Home.razor shows up when everything is loaded
        const title = document.querySelector('#app .splash-title');
        const plain = title ? title.textContent : '';
        let shown = '', percent = -1;

        function tick() {
            // runs while a loading screen is up (also the one of Home.razor, which shows the last percentage)
            if (stopped || !document.querySelector('.splash')) return;
            // Blazor counts the satellite resource assemblies (loadAllSatelliteResources) beyond its total: up to 100 % only
            const p = Math.min(100, Math.round(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--blazor-load-percentage')) || 0));
            if (p !== percent) {
                percent = p;
                document.documentElement.style.setProperty('--splash-percent', p + '%');
                document.documentElement.style.setProperty('--splash-percent-text', `"${p}%"`);
            }
            if (title && title.isConnected) decrypt(p);
            requestAnimationFrame(tick);
        }

        function decrypt(p) {
            const done = Math.round(plain.length * p / 100);
            const k = shift();
            const enc = plain.slice(done).replace(/./g, c => caesar(c, k));
            const html = plain.slice(0, done) + '\u0000' + enc;
            if (html !== shown) {
                shown = html;
                title.textContent = plain.slice(0, done);
                if (enc) {
                    const span = document.createElement('span');
                    span.className = 'enc';
                    span.textContent = enc;
                    title.appendChild(span);
                }
            }
            if (done >= plain.length) title.closest('.splash').classList.add('done');
        }

        document.querySelectorAll('.splash-disk').forEach(draw);
        tick();
        // Home.razor puts up its own loading screen: give it the disk as well; done once that screen is gone
        const watch = new MutationObserver(() => {
            document.querySelectorAll('.splash-disk:empty').forEach(draw);
            if (!document.querySelector('.splash')) watch.disconnect();
        });
        watch.observe(document.getElementById('app'), { childList: true, subtree: true });

        return {
            // the app cannot start: the plain title, no progress ring
            stop() {
                stopped = true;
                if (title) {
                    title.textContent = plain;
                    title.closest('.splash').classList.add('failed');
                }
            }
        };
    })();
</script>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a class="reload" href=".">Reload</a>
    <span class="dismiss">🗙</span>
</div>
<script src="canvas.js"></script>
<script src="wpf.js"></script>
<script src="vfs.js"></script>
<script src="offline.js"></script>
<script src="noteeditor.js"></script>
<script src="lib/katex/katex.min.js"></script>
<script src="lib/katex/auto-render.min.js"></script>
<script src="docs.js"></script>
<script src="engine.js"></script>
<script src="media.js"></script>
<script autostart="false" src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
<script>
    // plugin texts come in every language the app offers: load all satellite resource assemblies
    Blazor.start({
        configureRuntime: runtime => runtime
            .withConfig({
                loadAllSatelliteResources: true,
                // The runtime loads the resource assemblies of the browser's language (e.g. de-DE) with a synchronous
                // call from the UI thread, which the default mode of the multi-threaded runtime refuses: the app would
                // not start in a German browser. This mode allows such calls; blocking waits inside them still throw.
                jsThreadBlockingMode: 'ThrowWhenBlockingWait',
            })
            // the .NET runtime stopped (e.g. a Mono abort): show the error report (crashreport.js)
            .withModuleConfig({
                onAbort: reason => ctCrash.runtimeAborted(reason),
                onExit: code => { if (code !== 0) ctCrash.runtimeAborted('exit code ' + code); },
            }),
    });
    // offline use and installation as an app (see service-worker.js)
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => { /* not available (e.g. private window) */ });
</script>
</body>

</html>
