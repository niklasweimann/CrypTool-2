<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrypWeb.App</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <style>
        html,body{margin:0;height:100%}
        .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
            background:linear-gradient(#e8eef9,#c3d3f2);font-family:"Segoe UI",system-ui,sans-serif;color:#2b3f6b}
        .splash-logo{width:120px;height:auto;margin-bottom:10px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
        .splash-title{font-size:28px;font-weight:600;letter-spacing:.5px}
        .splash-sub{font-size:13px;color:#5b6f98;margin-bottom:18px}
        .splash-bar{width:240px;height:8px;border-radius:4px;background:#fff;box-shadow:inset 0 0 0 1px #9fb2d8;overflow:hidden}
        .splash-fill{height:100%;width:var(--blazor-load-percentage,0%);background:linear-gradient(#5b86d6,#3b5aa0);transition:width .2s}
        .splash-text{font-size:12px;color:#5b6f98;margin-top:6px;min-height:16px}
        .splash-text::after{content:var(--blazor-load-percentage-text,"")}
    </style>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/i18n.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CrypWeb.App.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="splash">
            <img class="splash-logo" src="logo.png" alt="" />
            <div class="splash-title">CrypTool 2</div>
            <div class="splash-sub">Web edition</div>
            <div class="splash-bar"><div class="splash-fill"></div></div>
            <div class="splash-text">Loading…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="canvas.js"></script>
    <script src="engine.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
